<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — Voz Bíblica</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --tinta:#101728; --azul:#2563eb; --gris:#5a6480; --linea:rgba(16,23,40,0.14); }
  * { box-sizing:border-box; }
  body { margin:0; background:#ffffff; color:var(--tinta); font-family:'Figtree',system-ui,sans-serif; }
  .caja { max-width:400px; margin:0 auto; padding:48px 24px 64px; }
  .logo { display:block; width:100%; max-width:230px; margin:0 auto 34px; }
  h1 { font-size:28px; font-weight:800; letter-spacing:-0.028em; margin:0 0 6px; }
  .sub { font-size:14.5px; line-height:1.55; color:var(--gris); margin:0 0 28px; }
  label { display:block; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--gris); margin:0 0 7px; }
  input { width:100%; padding:13px 14px; font:inherit; font-size:15px; color:var(--tinta); background:#fff; border:1px solid var(--linea); border-radius:12px; }
  input:focus { outline:none; border-color:var(--azul); box-shadow:0 0 0 3px rgba(37,99,235,0.14); }
  .campo { margin-bottom:16px; }
  .pista { font-size:12px; color:var(--gris); margin-top:6px; }
  button { width:100%; min-height:50px; padding:14px; font:inherit; font-size:15.5px; font-weight:700; color:#fff; background:var(--azul); border:none; border-radius:12px; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  button:disabled { opacity:0.55; cursor:default; }
  .aviso { font-size:13.5px; line-height:1.5; padding:11px 13px; border-radius:10px; margin-bottom:16px; }
  .error { background:rgba(200,30,20,0.09); color:#a3170c; }
  .ok { background:rgba(18,133,75,0.10); color:#0d6b3c; }
  .pie { margin-top:22px; padding-top:20px; border-top:1px solid var(--linea); text-align:center; font-size:14px; color:var(--gris); }
  a { color:var(--azul); text-decoration:none; font-weight:600; }
  a:hover { color:#1d4ed8; }
  .legal { margin-top:18px; font-size:11.5px; line-height:1.55; color:var(--gris); text-align:center; }
</style>
</head>
<body>
<div class="caja">
  <a href="index.html"><img class="logo" src="logo-app.png" alt="Voz Bíblica"></a>
  <h1>Crear cuenta</h1>
  <p class="sub">Tu cuenta guarda dónde te quedaste, tus favoritos y tus notas en todos tus aparatos.</p>

  <div id="aviso"></div>

  <form id="form">
    <div class="campo">
      <label for="correo">Correo</label>
      <input id="correo" type="email" name="username" autocomplete="username" placeholder="correo@ejemplo.com" required>
    </div>
    <div class="campo">
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" name="new-password" autocomplete="new-password" placeholder="••••••" minlength="6" required>
      <div class="pista">Mínimo 6 caracteres.</div>
    </div>
    <div class="campo">
      <label for="pass2">Repite la contraseña</label>
      <input id="pass2" type="password" name="confirm-password" autocomplete="new-password" placeholder="••••••" minlength="6" required>
    </div>
    <button id="btn" type="submit">Crear mi cuenta</button>
  </form>
    <div style="display:flex;align-items:center;gap:12px;margin:22px 0;">
      <span style="flex:1;height:1px;background:var(--linea);"></span>
      <span style="font-size:12px;color:var(--gris);">o</span>
      <span style="flex:1;height:1px;background:var(--linea);"></span>
    </div>
    <button type="button" id="google" style="background:#ffffff;color:var(--tinta);border:1px solid var(--linea);display:flex;align-items:center;justify-content:center;gap:10px;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.8-.4-4H24v7.6h12c-.2 2-1.5 5-4.8 7l-.1.4 7 5.4.5.1c4.4-4.1 6.5-10.1 6.5-16.5z"/><path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7-5.4c-1.9 1.3-4.4 2.2-7.6 2.2-5.8 0-10.7-3.8-12.4-9.1l-.4.1-7 5.4-.1.4C7.7 41 15.3 46 24 46z"/><path fill="#FBBC05" d="M11.6 28.3c-.5-1.3-.7-2.8-.7-4.3s.3-3 .7-4.3v-.5l-7.3-5.6-.2.1C2.7 16.8 2 20.3 2 24s.7 7.2 2.1 10.3l7.5-6z"/><path fill="#EA4335" d="M24 10.8c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.6 30 2 24 2 15.3 2 7.7 7 4.1 13.7l7.5 5.9C13.3 14.6 18.2 10.8 24 10.8z"/></svg>
      <span id="gtxt">Continuar con Google</span>
    </button>

  <p class="legal">Al crear tu cuenta aceptas los términos y el aviso de privacidad de Voz Bíblica.</p>

  <div class="pie">
    ¿Ya tienes cuenta? <a href="entrar.html">Iniciar sesión</a>
  </div>
  <p style="margin-top:18px;text-align:center;font-size:13px;"><a href="contacto.html">¿Necesitas ayuda? Escríbenos</a></p>
</div>

<script>
const SB_URL = 'https://mkjahlxsjwnleapfbiez.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ramFobHhzandubGVhcGZiaWV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MTIwNTMsImV4cCI6MjEwMjQ4ODA1M30.cBA5r4VVeRA08OSENtNYH_HYGbyLZkR0LzjCUMjsnJE';
const sb = window.supabase.createClient(SB_URL, SB_ANON, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' }
});

const aviso = document.getElementById('aviso');
const btn = document.getElementById('btn');
const mostrar = (texto, clase) => { aviso.innerHTML = '<div class="aviso ' + clase + '">' + texto + '</div>'; };

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('correo').value.trim();
  const password = document.getElementById('pass').value;
  const password2 = document.getElementById('pass2').value;
  if (password !== password2) { mostrar('Las contraseñas no coinciden.', 'error'); return; }

  btn.disabled = true; btn.textContent = 'Creando…';
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { emailRedirectTo: location.origin + '/app.html' }
  });
  btn.disabled = false; btn.textContent = 'Crear mi cuenta';

  if (error) {
    const msg = /already/i.test(error.message)
      ? 'Ese correo ya tiene cuenta. <a href="entrar.html">Inicia sesión</a>.'
      : error.message;
    mostrar(msg, 'error');
    return;
  }
  // Con confirmación por correo, Supabase no devuelve sesión todavía.
  if (data && data.session) { location.replace('pagar.html'); return; }
  mostrar('Listo. Te enviamos un correo para confirmar tu cuenta — ábrelo y ya puedes entrar.', 'ok');
  document.getElementById('form').style.display = 'none';
});

document.getElementById('google').addEventListener('click', async () => {
  const t = document.getElementById('gtxt');
  t.textContent = 'Abriendo Google…';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + '/app.html' }
  });
  if (error) { t.textContent = 'Continuar con Google'; mostrar(error.message, 'error'); }
});
</script>
</body>
</html>
