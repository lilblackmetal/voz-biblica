document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

wap;\n  src: url(\"97306cb3-b59d-47a3-81aa-cd10a2c946e9\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"935b84be-71a7-4ccd-b9f0-c9fd8d069aff\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"db3957b5-d857-4139-b74f-6d92fa76aba9\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c450bb9f-45c8-497f-b824-7f5699543ba3\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1a19b7ea-b33d-4170-9916-5ca5b87ed19b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f8b4a4f0-2cc5-4144-a3f6-e149f3d0b999\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d0ff2ab0-211e-4e44-9b83-4641948fc38b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent);       \n        <span style=\"display:flex;flex-direction:column;gap:10px;margin-top:22px;\">\n        <a href=\"app.html?lang=es#entrar\" style=\"display:flex;align-items:center;justify-content:center;min-height:52px;font-size:16px;font-weight:600;border-radius:12px;text-decoration:none;background:#000000;border:1.5px solid #000000;color:#ffffff;\">Iniciar sesión<\u002Fa>\n        <a href=\"app.html?lang=es#crear\" style=\"display:flex;align-items:center;justify-content:center;min-height:52px;font-size:16px;font-weight:600;border-radius:12px;text-decoration:none;background:transparent;border:1px solid var(--color-neutral-700);color:var(--color-text);\">Crear cuenta<\u002Fa>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:clamp(30px,5vw,64px) clamp(20px,5vw,72px) clamp(20px,3vw,40px);box-sizing:border-box;\">\n    <div style=\"font-size:13px;line-height:1.3;letter-spacing:0.06em;text-transform:uppercase;color:#101728;margin:0 0 14px;\">Acerca de<\u002Fdiv>\n    <h1 style=\"font-family:var(--font-heading);font-weight:500;font-size:clamp(30px,4.4vw,52px);line-height:1.12;letter-spacing:-0.018em;margin:0 0 18px;max-width:24ch;\">La Biblia es el libro más vendido de la historia. Y el menos terminado.<\u002Fh1>\n    <div style=\"max-width:60ch;display:grid;gap:20px;font-size:17px;line-height:1.68;color:color-mix(in srgb, var(--color-text) 82%, transparent);\">\n      <p style=\"margin:0;\">Casi todos tenemos una en casa. Casi nadie la ha leído completa. No es falta de fe: es que se empieza en Génesis con ganas y se abandona en Levítico, entre palabras de hace cuatrocientos años y nombres que se repiten.<\u002Fp>\n      <p style=\"margin:0;\">Voz Bíblica nació para cambiar ese final. Alguien te cuenta cada capítulo en voz alta, en las palabras que usas hoy, sin cambiar lo que dice. La base es la Reina Valera 1909; nuestro trabajo es explicarla, no corregirla.<\u002Fp>\n      <p style=\"margin:0;\">Funciona en el tiempo que ya tienes: el carro, la cocina, la caminata, antes de dormir. Veinte minutos al día y, sin darte cuenta, llegas al Apocalipsis.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(40px,6vw,68px);padding:clamp(28px,4vw,44px);box-sizing:border-box;background:#161826;border:1px solid #161826;border-radius:16px;\">\n      <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#000000;margin-bottom:18px;\">Nuestra misión<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:clamp(28px,4.2vw,48px);line-height:1.08;letter-spacing:-0.025em;margin:0 0 16px;max-width:18ch;color:#ffffff;text-wrap:balance;\">La misión que mueve nuestro trabajo cada día<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;margin:0 0 clamp(28px,4vw,40px);max-width:44ch;color:rgba(255,255,255,0.78);\">Que cualquier persona entienda la Biblia completa, escuchándola.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:clamp(16px,2.4vw,28px);\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.14);\">\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;font-feature-settings:'tnum' 1;color:#000000;\">01<\u002Fspan>\n          <span style=\"font-family:var(--font-heading);font-size:18px;font-weight:500;letter-spacing:-0.01em;color:#ffffff;\">Completa<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.72);\">Los 66 libros, sin recortes.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.14);\">\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;font-feature-settings:'tnum' 1;color:#000000;\">02<\u002Fspan>\n          <span style=\"font-family:var(--font-heading);font-size:18px;font-weight:500;letter-spacing:-0.01em;color:#ffffff;\">Clara<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.72);\">En palabras de hoy.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.14);\">\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;font-feature-settings:'tnum' 1;color:#000000;\">03<\u002Fspan>\n          <span style=\"font-family:var(--font-heading);font-size:18px;font-weight:500;letter-spacing:-0.01em;color:#ffffff;\">Terminada<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.72);\">De Génesis al Apocalipsis.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(40px,6vw,68px);\">\n      <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#000000;margin-bottom:14px;\">Cómo escribimos<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:clamp(22px,2.8vw,32px);line-height:1.2;letter-spacing:-0.014em;margin:0 0 12px;max-width:26ch;\">Nuestros principios de escritura<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.64;margin:0 0 26px;max-width:56ch;color:color-mix(in srgb, var(--color-text) 78%, transparent);\">Estos son los principios que guían cómo construimos Voz Bíblica. Si estás de acuerdo con ellos, vas a amar Voz Bíblica.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));max-width:1000px;gap:1px;background:var(--color-divider);border:1px solid var(--color-divider);border-radius:16px;overflow:hidden;\">\n        <sc-for list=\"{{ principios }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div class=\"vb-tarjeta-clara\" style=\"background:#161826;padding:24px 22px;\">\n            <div style=\"font-family:var(--font-heading);font-weight:500;font-size:clamp(22px,2.4vw,28px);line-height:1;font-feature-settings:'tnum' 1;color:#000000;margin-bottom:14px;\">{{ p.n }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:500;font-size:17px;letter-spacing:-0.008em;margin-bottom:9px;color:#ffffff;\" class=\"vb-tc-tit\">{{ p.titulo }}<\u002Fdiv>\n            <div class=\"vb-tc-txt\" style=\"font-size:14.5px;line-height:1.6;color:rgba(255,255,255,0.78);\">{{ p.texto }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(40px,6vw,68px);\">\n      <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#000000;margin-bottom:14px;\">Qué hay detrás<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-heading);font-weight:500;font-size:clamp(22px,2.8vw,32px);line-height:1.2;letter-spacing:-0.014em;margin:0 0 12px;max-width:26ch;\">Qué hay detrás de Voz Bíblica.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.64;margin:0 0 30px;max-width:56ch;color:color-mix(in srgb, var(--color-text) 78%, transparent);\">Cada uno de los 66 libros pasa por el mismo camino antes de que lo escuches.<\u002Fp>\n      <div style=\"display:grid;gap:0;max-width:820px;\">\n        <sc-for list=\"{{ proceso }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:clamp(14px,2.4vw,22px);border-top:1px solid var(--color-divider);padding:24px 0;\">\n            <div style=\"font-family:var(--font-heading);font-weight:500;font-size:clamp(20px,2.2vw,26px);line-height:1;font-feature-settings:'tnum' 1;color:#000000;\">{{ p.n }}<\u002Fdiv>\n            <div style=\"min-width:0;\">\n              <div style=\"font-family:var(--font-heading);font-weight:500;font-size:clamp(18px,2.2vw,22px);line-height:1.28;letter-spacing:-0.01em;margin-bottom:8px;\">{{ p.titulo }}<\u002Fdiv>\n              <p style=\"font-size:15.5px;line-height:1.66;margin:0;max-width:58ch;color:color-mix(in srgb, var(--color-text) 78%, transparent);\">{{ p.texto }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <footer style=\"background:#000000;color:#ffffff;\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:clamp(44px,6vw,72px) clamp(20px,5vw,72px) 0;box-sizing:border-box;\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:clamp(30px,4vw,48px);padding-bottom:clamp(36px,5vw,56px);\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0;\">\n          <a href=\"index.html\" style=\"display:flex;text-decoration:none;\">\n            <img src=\"e84fffeb-5a07-4d2d-ada9-ae2fba7c15be\" alt=\"Voz Bíblica — En lenguaje sencillo\" style=\"display:block;width:clamp(228px,34vw,324px);height:auto;\">\n          <\u002Fa>\n          <p style=\"font-size:18px;line-height:1.45;font-weight:500;margin:0;max-width:30ch;color:rgba(255,255,255,0.66);\">App cristiana: la Biblia entretenida al escuchar, fácil de aprender y poderosa para vivir.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n            <span data-vb-idioma-lab=\"1\" style=\"flex-basis:100%;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:2px;\">Idioma<\u002Fspan>\n            <a href=\"acerca.html\" style=\"display:inline-flex;align-items:center;min-height:34px;padding:8px 14px;border-radius:10px;background:#d97757;border:1px solid #d97757;font-size:11.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#ffffff;\">Español<\u002Fa>\n            <a href=\"acerca-en.html\" style=\"display:inline-flex;align-items:center;min-height:34px;padding:8px 14px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.28) ng:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.44);margin-bottom:3px;\">Voz Bíblica<\u002Fdiv>\n          <a href=\"acerca.html\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Acerca de<\u002Fa>\n          <a href=\"acerca.html\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Nuestra misión<\u002Fa>\n          <a href=\"acerca.html\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Principios de escritura<\u002Fa>\n          <a href=\"acerca.html\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Qué hay detrás<\u002Fa>\n          <a href=\"contenido.html\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Cómo nos comparamos<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;min-width:0;\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.44);margin-bottom:3px;\">Empezar<\u002Fdiv>\n          <a href=\"index.html#precios\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Precios<\u002Fa>\n          <a href=\"app.html?lang=es#crear\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Crear cuenta<\u002Fa>\n          <a href=\"app.html?lang=es#entrar\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Iniciar sesión<\u002Fa>\n          <a href=\"app.html?lang=es#crear\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Ver la biblioteca<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;min-width:0;\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.44);margin-bottom:3px;\">Ayuda<\u002Fdiv>\n          <a href=\"contacto.html\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Contacto<\u002Fa>\n          <a href=\"index.html#precios\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Preguntas sobre el pago<\u002Fa>\n          <a href=\"contacto.html\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Cancelar membresía<\u002Fa>\n          <a href=\"contacto.html\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Reportar un problema<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 26px;justify-content:space-between;align-items:center;padding:22px 0 40px;border-top:1px solid rgba(255,255,255,0.13);\">\n        <div style=\"font-size:13px;line-height:1.6;color:rgba(255,255,255,0.66);max-width:60ch;\">Basada en la Reina Valera 1909 y la King James Version, contada en lenguaje de hoy. © 2026 Voz Bíblica. · v20260907<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px 20px;font-size:13px;\">\n          <a href=\"contacto.html\" style=\"color:rgba(255,255,255,0.5);\" style-hover=\"color:#ffffff;\">Términos<\u002Fa>\n          <a href=\"contacto.html\" style=\"color:rgba(255,255,255,0.5);\" style-hover=\"color:#ffffff;\">Privacidad<\u002Fa>\n          <a href=\"mailto:contacto@vozbiblica.com\" style=\"color:rgba(255,255,255,0.5);\" style-hover=\"color:#ffffff;\">contacto@vozbiblica.com<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  PRINCIPIOS = [\n    ['El texto no se toca', 'Explicamos en palabras de hoy sin quitar ni agregar nada al mensaje. La base es la Reina Valera 1909 (en inglés, la King James Version) y el trabajo está en aclararla, no en corregirla.'],\n    ['Se entiende la primera vez', 'Si un capítulo necesita que lo escuches tres veces para saber qué pasó, el trabajo no está terminado.'],\n    ['Nada de relleno', 'No adornamos ni alargamos. Si un capítulo se cuenta en pocas líneas, se cuenta en pocas líneas.'],\n    ['Palabras que ya usas', 'Sin vocabulario de seminario. Cuando una palabra antigua es necesaria, la explicamos ahí mismo en vez de esquivarla.'],\n    ['Sin sermón encima', 'Contamos lo que dice el texto y dejamos que hable. La aplicación a tu vida la haces tú, no nosotros.'],\n    ['Los nombres se aclaran', 'Cuando aparecen tres Herodes o dos Santiagos, decimos cuál es cuál. Es donde casi todo el mundo se pierde.'],\n  ];\n\n  PROCESO = [\n    ['Se lee el capítulo entero', 'Nada se resume de memoria. Se parte del texto de la Reina Valera 1909, versículo por versículo, con el contexto del libro completo alrededor.'],\n    ['Se cuenta en lenguaje de hoy', 'Se reescribe para que se entienda al oírlo una sola vez: nombres aclarados, frases cortas, el orden de los hechos claro. Sin quitar ni agregar nada al mensaje.'],\n    ['Se revisa contra el original', 'Cada capítulo se compara de vuelta con el texto para confirmar que dice lo mismo. Lo que no se pueda sostener en el texto, se corta.'],\n    ['Se graba y se publica', 'La narración se genera con la voz de Voz Bíblica, se escucha completa y queda disponible en español y en inglés.'],\n  ];\n\n  renderVals() {\n    return {\n      principios: this.PRINCIPIOS.map(([titulo, texto], i) => ({ n: String(i + 1).padStart(2, '0'), titulo, texto })),\n      proceso: this.PROCESO.map(([titulo, texto], i) => ({ n: String(i + 1).padStart(2, '0'), titulo, texto })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
