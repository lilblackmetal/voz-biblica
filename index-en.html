ot(.vb-switch-bola) { color:#14161d !important; border-color:rgba(20,22,29,0.16) !important; }\n  html.vb-noche footer.vb-pie [style*=\"background:#fd3852\"], html.vb-noche footer.vb-pie [style*=\"background:#fd3852\"] *,\n  html.vb-noche footer.vb-pie [style*=\"background:#fd3852\"], html.vb-noche footer.vb-pie [style*=\"background:#fd3852\"] * { color:#ffffff !important; }\n  html.vb-noche footer.vb-pie .vb-switch-pista { background:#c7c7cc !important; }\n<\u002Fstyle>\n<footer class=\"vb-pie\" style=\"background:#000000;color:#ffffff;\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:clamp(44px,6vw,72px) clamp(20px,5vw,72px) 0;box-sizing:border-box;\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:clamp(30px,4vw,48px);padding-bottom:clamp(36px,5vw,56px);\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0;\">\n          <a href=\"index-en.html\" style=\"display:flex;text-decoration:none;\">\n            <img src=\"ecd969c6-7f5a-4eb9-87f5-a71b34680a40\" alt=\"Voz Bíblica — En lenguaje sencillo\" style=\"display:block;width:clamp(180px,26vw,240px);height:auto;\">\n          <\u002Fa>\n          <p style=\"font-size:14px;line-height:1.6;margin:0;max-width:30ch;color:rgba(255,255,255,0.66);\">A Christian app: the Bible, a joy to hear, easy to learn, and powerful to live by.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n            <span data-vb-idioma-lab=\"1\" style=\"flex-basis:100%;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:2px;\">Language<\u002Fspan>\n            <a href=\"index.html\" style=\"display:inline-flex;align-items:center;min-height:34px;padding:8px 14px;border-radius:10px;background:#ffffff;border:1px solid #ffffff;font-size:11.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#000000;transition:color 0.14s ease, border-color 0.14s ease;\" style-hover=\"background:#f0f2f6;border-color:#f0f2f6;color:#000000;\">Español<\u002Fa>\n            <a href=\"index-en.html\" style=\"display:inline-flex;align-items:center;min-height:34px;padding:8px 14px;border-radius:10px;background:#fd3852;border:1px solid #fd3852;font-size:11.5px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#ffffff;\">English<\u002Fa>\n            <span style=\"flex-basis:100%;height:0;\"><\u002Fspan>\n            <button type=\"button\" class=\"vb-switch\" data-vb-alterna=\"1\" role=\"switch\" aria-label=\"Light mode\"><span class=\"vb-switch-pista\"><span class=\"vb-switch-bola\"><\u002Fspan><\u002Fspan><span>Light mode<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;min-width:0;\"><div style=\"font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.44);margin-bottom:3px;\">Help<\u002Fdiv>\n          <a href=\"suscripcion-en.html\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Subscribe<\u002Fa>\n          <a href=\"app.html?lang=en#entrar\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Sign in<\u002Fa>\n          <a href=\"#preguntas\" style=\"font-size:14px;line-height:1.5;color:rgba(255,255,255,0.66);transition:color 0.14s ease;\" style-hover=\"color:#ffffff;\">Frequently asked questions<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 26px;justify-content:space-between;align-items:center;padding:22px 0 40px;border-top:1px solid rgba(255,255,255,0.13);\">\n        <div style=\"font-size:13px;line-height:1.6;color:rgba(255,255,255,0.5);max-width:60ch;\">Based on the King James Version, told in plain language. © 2026 Voz Bíblica.<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px 20px;font-size:13px;\">\n          <a href=\"mailto:contacto@vozbiblica.com\" style=\"color:rgba(255,255,255,0.5);\" style-hover=\"color:#ffffff;\">contacto@vozbiblica.com<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { plan: 'ano', faqAbierta: null };\n  CIFRAS = [['66', 'Books with a guide'], ['1,189', 'Narrated chapters'], ['22', 'Long stories'], ['2', 'Languages']];\n\n  BLOQUES = [\n    ['The whole Bible', 'All 66 books, chapter by chapter', 'From Genesis to Revelation, each of the 1,189 chapters read aloud and told in plain words, without changing what it says. Based on the King James Version.'],\n    ['Book guides', 'A guide for every one of the 66', 'Before you enter a book you know what it is about: who wrote it, to whom, at what moment and what thread it follows. The people who appear, the places where it happens, and where to start if it is your first time.'],\n    ['Stories', 'Long stretches to hear straight through', 'Twenty-two stories that gather the chapters of a single stretch: the Creation and the flood, Abraham, Joseph in Egypt, Moses and the way out of Egypt, the life of Jesus, the church beginning. Half an hour or more each, with no chapter to pick.'],\n    ['To understand', 'The plain text next to the audio', 'You follow the reading while it plays. Tap any word you do not know and its meaning appears. Adjust the size, the typeface and the width of the page.'],\n    ['To search', 'By what you are going through', 'Anxiety, forgiveness, family, money, grief — you search by what you are carrying and we take you to the passages that speak to it. Also by person, by place and along the timeline.'],\n    ['To pray', 'Sixteen guided prayers', 'Fear, your children, your marriage, losing work, before sleep, losing someone. Words made for real moments, not formulas.'],\n    ['Christian Mentor', 'Ask what weighs on you', 'A conversation about faith and daily life, as often as you need it, with answers grounded in the text.'],\n    ['Yours', 'Notes, favorites and saves', 'You save chapters and books, write notes under any chapter and mark favorites. The app remembers where you left off and installs on your phone.'],\n  ];\n\n  COMPARACION = [\n    ['Audio of all 66 books', 'The 1,189 chapters narrated', 'Partial or robotic voice', 'Yes, complete', 'No'],\n    ['Explained in today\\'s language', 'Every chapter told in plain words', 'Only the old text', 'Read as is', 'Only the old text'],\n    ['Half-hour stories', '22 stretches to hear straight through', 'No', 'By chapter or by book', 'No'],\n    ['Search by what you feel', 'Anxiety, forgiveness, money, grief', 'Word search', 'No', 'Index at the back'],\n    ['Ask and get an answer', 'Christian Mentor, no limit', 'No', 'No', 'No'],\n    ['No ads', 'Never', 'Ads or donations', 'No ads', 'No ads'],\n    ['Cost', '$2.70 a month or $21.60 a year', 'Free', 'One or two titles for that price', 'A single payment'],\n  ];\n  PRINCIPIOS = [\n    ['The text stays untouched', 'We explain it in today\\'s words without taking anything from the message or adding to it. The base is the King James Version, and the work is in clarifying it, not correcting it.'],\n    ['Clear the first time', 'If a chapter needs three listens before you know what happened, the work is not finished.'],\n    ['No filler', 'We do not decorate or stretch. If a chapter is told in a few lines, it is told in a few lines.'],\n    ['Words you already use', 'No seminary vocabulary. When an old word is necessary, we explain it right there instead of dodging it.'],\n    ['No sermon on top', 'We tell what the text says and let it speak. Applying it to your life is your job, not ours.'],\n    ['The names get sorted out', 'When three Herods or two Jameses show up, we say which is which. That is where almost everyone gets lost.'],\n  ];\n\n  PROCESO = [\n    ['The whole chapter gets read', 'Nothing is summarized from memory. We start from the public-domain text, verse by verse, with the context of the whole book around it.'],\n    ['It gets told in today\\'s language', 'It is rewritten so you understand it on a single listen: names clarified, short sentences, the order of events clear. Nothing taken from the message or added to it.'],\n    ['It gets checked against the original', 'Every chapter is compared back to the text to confirm it says the same thing. Whatever the text will not support gets cut.'],\n    ['It gets recorded and published', 'The narration is generated in the Voz Bíblica voice, listened to end to end, and made available in English and Spanish.'],\n  ];\n\n  contenidoVals() {\n    return {\n      comparacion: this.COMPARACION.map(([fila, vb, gratis, audio, papel]) => ({ fila, vb, gratis, audio, papel })),\n      cifras: this.CIFRAS.map(([n, q]) => ({ n, q })),\n      bloques: this.BLOQUES.map(([kicker, titulo, texto]) => ({ kicker, titulo, texto })),\n    };\n  }\n\n  acercaVals() {\n    return {\n      principios: this.PRINCIPIOS.map(([titulo, texto], i) => ({ n: String(i + 1).padStart(2, '0'), titulo, texto })),\n      proceso: this.PROCESO.map(([titulo, texto], i) => ({ n: String(i + 1).padStart(2, '0'), titulo, texto })),\n    };\n  }\n\n\n  // ── COBROS ──────────────────────────────────────────────────────────────\n  // Los dos enlaces de pago viven aquí y en ningún otro lugar del archivo.\n  // Si cambian los planes en Stripe, basta cambiar estas dos líneas.\n  ENLACE_MENSUAL = \"https://buy.stripe.com/00w00k9RZ8wdgu216X6Na0y\";\n  ENLACE_ANUAL = \"https://buy.stripe.com/28E8wQc07fYF7Xw2b16Na0z\";\n\n  CONFIANZA = [\n    'Secure card payment',\n    'Your freedom comes first: cancel whenever you want, no questions',\n    'You understand it the first time you hear it',\n    'Keeps playing with the screen off',\n  ];\n\n  BENEFICIOS = [\n    ['Clearer decisions', 'Proverbs and centuries of wisdom, applied to what you are deciding today.'],\n    ['More patience at home', 'Stories of people who already carried what you carry with your children, your partner or your parents.'],\n    ['Less anxiety', 'Psalms made to actually calm you, not just to be skimmed.'],\n    ['More strength in a crisis', 'Examples of people who lost everything and got back up, step by step.'],\n    ['Discipline without the struggle', 'One chapter a day builds the habit on its own, without relying on willpower.'],\n    ['More weight when you speak', 'When you quote something that has held up three thousand years, it shows.'],\n  ];\n\n  INCLUYE = [\n    ['All 66 books', '1,189 chapters, from Genesis to Revelation, each one narrated and told in today\\'s words.'],\n    ['English and Spanish', 'Switch language inside the same chapter and the audio switches with you.'],\n    ['Half-hour stories', 'Long stretches like the Creation, Joseph in Egypt or the life of Jesus, to listen straight through.'],\n    ['Plays without internet', 'Whatever you have opened stays on your phone and plays with no signal.'],\n    ['Prayers, people and places', 'Guided prayers for real moments, who is who and where each thing happened.'],\n    ['Christian Mentor', 'Ask whatever you want about faith and daily life, as many times as you need.'],\n  ];\n\n  FAQ = [\n    ['What is Voz Bíblica?', 'The whole Bible read aloud and told in today\\'s words, chapter by chapter. All 66 books and 1,189 chapters, without changing what it says.'],\n    ['Which Bible is it based on?', 'In English, the King James Version. In Spanish, the Reina Valera 1909. Both are public domain; we just tell it in plain language.'],\n    ['How much does it cost?', '$299 pesos a month or $2,399 pesos a year. The yearly plan saves you two months.'],\n    ['Does it renew? How do I cancel?', 'Yes, it renews on its own. Cancel whenever you want from your account, in a minute, no contracts or calls.'],\n    ['How can I pay?', 'With a credit or debit card from any country, securely through Stripe. If cash is your only option, write to us and we will sort it out.'],\n    ['I already paid, how do I get in?', 'Create your account or sign in with the same email you paid with. Your access opens on its own.'],\n    ['Does it work offline?', 'Yes. What you already opened stays on your phone and plays with no signal, even with the screen off.'],\n    ['Does it work on several devices?', 'Yes. Sign in with your email on your phone, tablet and computer, and pick up right where you left off.'],\n    ['What is the Christian Mentor?', 'An AI chat that answers you with Scripture, at any hour. It does not replace a flesh-and-blood pastor.'],\n    ['What if I stop paying?', 'The chapters close, but your notes, favorites and progress are kept. When you come back you pick up where you left off.'],\n  ];\n\n\n  preciosVals() {\n    const mes = this.state.plan === 'mes';\n    const ano = this.state.plan === 'ano';\n    return {\n      confianza: this.CONFIANZA.map(texto => ({ texto })),\n      beneficios: this.BENEFICIOS.map(([titulo, texto]) => ({ titulo, texto })),\n      incluye: this.INCLUYE.map(([titulo, texto]) => ({ titulo, texto })),\n      faq: this.FAQ.map(([q, a], i) => {\n        const abierta = this.state.faqAbierta === i;\n        return {\n          q, a,\n          alternar: () => this.setState({ faqAbierta: abierta ? null : i }),\n          flecha: 'flex:none;margin-top:1px;transition:transform 0.2s ease;transform:rotate(' + (abierta ? 180 : 0) + 'deg);opacity:0.55;',\n          panel: 'overflow:hidden;display:grid;grid-template-rows:' + (abierta ? '1fr' : '0fr') + ';transition:grid-template-rows 0.24s ease;',\n        };\n      }),\n      enlaceMensual: this.ENLACE_MENSUAL,\n      enlaceAnual: this.ENLACE_ANUAL,\n      enlacePago: mes ? this.ENLACE_MENSUAL : this.ENLACE_ANUAL,\n      textoPago: mes ? 'JOIN VOZ BÍBLICA' : 'JOIN VOZ BÍBLICA',\n      elegirMes: () => this.setState({ plan: 'mes' }),\n      elegirAno: () => this.setState({ plan: 'ano' }),\n      bordeMes: mes ? '#101728' : 'rgba(20,22,29,0.14)',\n      bordeAno: ano ? '#101728' : 'rgba(20,22,29,0.14)',\n      claseMes: mes ? 'vb-plancard vb-plansel' : 'vb-plancard',\n      claseAno: ano ? 'vb-plancard vb-plansel' : 'vb-plancard',\n      fondoMes: '#ffffff',\n      fondoAno: '#ffffff',\n      sombraMes: mes ? '0 10px 30px -18px rgba(16,23,40,0.4)' : 'none',\n      sombraAno: ano ? '0 10px 30px -18px rgba(16,23,40,0.4)' : 'none',\n      fondoBtnMes: '#101728',\n      tintaBtnMes: '#ffffff',\n      bordeBtnMes: '#101728',\n      fondoBtnAno: '#fd3852',\n      tintaBtnAno: '#ffffff',\n      bordeBtnAno: '#fd3852',\n    };\n  }\n\n\n  tarjeta(activo, orden) {\n    return 'order:' + orden + ';display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:16px;'\n      + 'box-sizing:border-box;cursor:pointer;transition:border-color 0.15s ease;background:var(--color-bg);color:var(--color-text);border:'\n      + (activo ? '1.5px solid var(--color-text)' : '1px solid var(--color-neutral-700)') + ';';\n  }\n\n  boton(activo) {\n    const base = 'display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:auto;'\n      + 'padding:11px 20px;font-size:14.5px;font-weight:600;border-radius:12px;border-style:solid;border-width:1px;';\n    return base + (activo\n      ? 'background:var(--color-accent);border-color:var(--color-accent);color:#ffffff;'\n      : 'background:transparent;border-color:rgba(16,23,40,0.26);color:#101728;');\n  }\n\n  renderVals() {\n    const p = this.state.plan;\n    return {\n      ...this.contenidoVals(),\n      ...this.acercaVals(),\n      ...this.preciosVals(),\n      // Tarjetas del homepage: mismo trato que en Precios — blanco al elegir,\n      // gris claro en reposo, y contorno solo en la elegida.\n      cardMes: 'display:flex;flex-direction:column;gap:9px;padding:22px 18px;border-radius:16px;box-sizing:border-box;min-width:0;cursor:pointer;'\n        + 'transition:background 0.15s ease, border-color 0.15s ease;background:' + (p === 'mes' ? '#ffffff' : '#f6f8fc')\n        + ';border:1px solid ' + (p === 'mes' ? '#101728' : 'transparent') + ';',\n      cardAno: 'position:relative;display:flex;flex-direction:column;gap:9px;padding:22px 18px;border-radius:16px;box-sizing:border-box;min-width:0;cursor:pointer;'\n        + 'transition:background 0.15s ease, border-color 0.15s ease;background:' + (p === 'ano' ? '#ffffff' : '#f6f8fc')\n        + ';border:1px solid ' + (p === 'ano' ? '#101728' : 'transparent') + ';',\n      badgeHomeAno: 'font-size:11px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;white-space:nowrap;color:'\n        + (p === 'ano' ? '#12854b' : '#5a6480') + ';',\n      planMes: this.tarjeta(p === 'mes', 1),\n      planAno: this.tarjeta(p === 'ano', 2),\n      planSiempre: this.tarjeta(p === 'siempre', 3),\n      elegirMes: () => this.setState({ plan: 'mes' }),\n      elegirAno: () => this.setState({ plan: 'ano' }),\n      elegirSiempre: () => this.setState({ plan: 'siempre' }),\n      btnMes: this.boton(p === 'mes'),\n      btnAno: this.boton(p === 'ano'),\n      btnSiempre: this.boton(p === 'siempre'),\n      badgeAno: 'font-size:11.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap;color:'\n        + (p === 'ano' ? '#02abda' : '#5a6480') + ';',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
